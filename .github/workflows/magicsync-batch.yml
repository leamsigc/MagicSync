# MagicSync manual-first automation: multi-day content batch (T130).
#
# Queues child workflow runs (one per day) through the same service path as
# UI-triggered quick actions. Runs generate drafts for review; scheduling or
# publishing still requires human approval per artifact.
# Required secrets: MAGICSYNC_API_URL, MAGICSYNC_MACHINE_SECRET.
name: MagicSync content batch

on:
  workflow_dispatch:
    inputs:
      businessId:
        description: 'Business ID that owns the batch'
        required: true
      action:
        description: 'Batch action'
        required: true
        default: 'multi-day-post'
        type: choice
        options:
          - multi-day-post
          - multi-day-carousel
          - multi-day-reel
          - repurpose
      days:
        description: 'Number of days (1-30)'
        required: false
        default: '7'
      theme:
        description: 'Batch theme (optional)'
        required: false
        default: ''
  # Cron stays commented until manual runs pass (T130 manual-first rule).
  # schedule:
  #   - cron: '0 6 * * MON'

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - name: Signed batch trigger
        env:
          MAGICSYNC_API_URL: ${{ secrets.MAGICSYNC_API_URL }}
          MAGICSYNC_MACHINE_SECRET: ${{ secrets.MAGICSYNC_MACHINE_SECRET }}
          BUSINESS_ID: ${{ inputs.businessId }}
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
          THEME: ${{ inputs.theme }}
        run: |
          python3 - <<'EOF' > batch.json
          import hashlib, hmac, json, os, time, urllib.request

          body = json.dumps({
              "businessId": os.environ["BUSINESS_ID"],
              "action": os.environ["ACTION"],
              "days": int(os.environ.get("DAYS") or 7),
              "theme": os.environ.get("THEME") or None,
          }).encode()
          timestamp = str(int(time.time()))
          signature = hmac.new(
              os.environ["MAGICSYNC_MACHINE_SECRET"].encode(),
              timestamp.encode() + b"." + body,
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["MAGICSYNC_API_URL"].rstrip("/") + "/api/v1/cli/batch",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "X-Machine-Timestamp": timestamp,
                  "X-Machine-Signature": signature,
              },
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          EOF
          cat batch.json
      - name: Upload run summary
        if: always()
        run: |
          {
            echo "## Batch summary"
            echo ""
            echo '```json'
            cat batch.json 2>/dev/null || echo '{"error": "no result file"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
