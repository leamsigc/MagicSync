name: Build Docker Image
on:
  push:
    branches: ["main"]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "leamsigc/magicsync"

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}
      # The default docker driver cannot export `type=gha` cache, so create
      # a docker-container buildx builder first — otherwise the build fails
      # with "Cache export is not supported for the docker driver".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image and push to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # Fastest CI builds by default: reuse GH Actions cached layers so
          # repeat builds skip straight to the changed stage.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest