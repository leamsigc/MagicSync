packages:
  - packages/*

# PRD-FLUE-AGENT-MIGRATION §5.3: @flue/runtime declares ^0.83.0 on the pi
# packages; 0.x caret ranges reject 0.85.1 and pnpm would install a second
# pi copy. Overrides force a single deduped pi resolution for the whole repo.
# PRD-FLUE-RUNTIME-CONVERGENCE D6: 0.86.1 injects a `system` turn-context
# message Flue 2.1.0 cannot map ("Unsupported message role in turn context:
# system"); 0.85.1 is the verified alignment.
overrides:
  '@earendil-works/pi-agent-core': 0.85.1
  '@earendil-works/pi-ai': 0.85.1

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  better-sqlite3: false
  canvas: true
  core-js: true
  esbuild: true
  onnxruntime-node: true
  pnpm: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalog:
  '@atproto/api': 0.23.1
  '@better-auth/utils': 0.5.0
  # FullCalendar must stay on one major: the plugin packages (daygrid/
  # timegrid/interaction/list/multimonth/scrollgrid) only publish 6.x stable,
  # and they import `@fullcalendar/core/internal.js` — an export that core 7
  # dropped. A 6.x plugin against core 7 fails the Rolldown resolve with
  # `"./internal.js" is not exported under the conditions [...]`.
  '@fullcalendar/core': 6.1.21
  '@fullcalendar/daygrid': 6.1.21
  '@fullcalendar/interaction': 6.1.21
  '@fullcalendar/list': 6.1.21
  '@fullcalendar/multimonth': 6.1.21
